# Free prototype: the web service sleeps when idle; PostgreSQL expires after 30 days.
databases:
  - name: application-tracker-db
    plan: free
    ipAllowList: []
    databaseName: application_tracker
    user: application_tracker
services:
  - type: web
    name: application-tracker
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: application-tracker-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.12"
