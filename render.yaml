# Paid services: review current Render prices before creating this Blueprint.
databases:
  - name: application-tracker-db
    plan: 0.1c-256mb
    diskSizeGB: 1
    ipAllowList: []
    databaseName: application_tracker
    user: application_tracker
services:
  - type: web
    name: application-tracker
    runtime: python
    plan: 0.5c-512mb
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: application-tracker-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.12"
